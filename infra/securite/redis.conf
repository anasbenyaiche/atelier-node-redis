# Atelier 14 — Redis volontairement "durci"
# Mot de passe de l'utilisateur par défaut
requirepass formation
# Commandes dangereuses désactivées (renommées en chaîne vide)
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
# Écouter sur toutes les interfaces DU CONTENEUR (le port n'est publié que sur la machine locale)
bind 0.0.0.0
protected-mode yes
